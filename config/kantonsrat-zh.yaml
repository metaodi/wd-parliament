# wd-parliament — Kantonsrat Zürich
#
# The first *cantonal* config. Same pipeline as config/parliament.yaml, a
# different source and a different join. Everything here was measured before it
# was written: README step 7, runs 13-15 (2026-07-30) of the
# `Verify assumptions` workflow, via scripts/verify_kantonsrat.py.
#
# Run it separately from the federal one — they write different files:
#
#   uv run python -m wd_parliament --config config/kantonsrat-zh.yaml \
#     --reports-dir reports/zh --docs-dir docs/zh

language: de

user_agent: "wd-parliament/0.1 (https://github.com/metaodi/wd-parliament; oderbolz@gmail.com)"
request_delay: 1.0

# ---------------------------------------------------------------------------
# Source
# ---------------------------------------------------------------------------
# api.openparldata.ch rather than the parlament.ch OData service, which is
# federal only. A *body* there is the level of parliament, so the canton is the
# body and the chamber is a group under it.
source: openparldata
body_key: ZH

# ---------------------------------------------------------------------------
# The identifier join  --  READ THIS BEFORE TURNING QUICKSTATEMENTS ON
# ---------------------------------------------------------------------------
# There is no cantonal P1307: it is the federal service, and joining on it would
# reach only the members who also sat in Bern — silently excluding exactly the
# people who never went federal, a bias that reads as coverage rather than as a
# bug.
#
# **P13468 is the right property and the wrong join, and run 20 (2026-08-04) is
# why.** "Zurich Kantonsrat and Regierungsrat member ID" is the canton's own
# member id and so the cantonal analogue of P1307; 28 of the 35 ZH people
# OpenParlData links to Wikidata carry it, against P14527's 35. But an
# identifier needs a value on *both* sides, and section C found:
#
#     value == person id:  0 of 28   (Ruth Genner: P13468 22518, person id 9532)
#     which column is it?  none of the person record's columns, for any of them
#
# So P13468 identifies these people in the canton's own dataset — which this
# tool does not read — and OpenParlData carries it nowhere. Joining on it would
# compare a person id against a different id space, and every ADD_IDENTIFIER
# suggestion would offer a number that is not this property's.
# `config.load_config` now refuses the combination outright. Supplying P13468
# properly means reading the canton's dataset (README step 7), not renaming a
# key here.
#
# That leaves P14527, the OpenParlData ID: Wikidata-asserted, and the only
# identifier whose value this source can actually produce (34 of 35 values are
# the ZH person id). Its known cost is that it reaches almost none of the
# *sitting* chamber — the first real run matched 0 of 180, with 138 falling
# through to the name search — because the 35 linked people are mostly members
# notable enough to have gone federal. The report's ADD_IDENTIFIER suggestions
# are the fix for that, and they are the highest-leverage edit here: each one
# makes a future run exact.
identifier_property: P14527

# ⚠️ FALSE, and run 20 is why. The 35th value disagrees — Q131948095 carries
# P14527 1411 while this body's person id is 17436 — because **OpenParlData
# holds one person record per person *per body***, so P14527 identifies a
# record and not a person, and an item can carry the record from another
# parliament. That is the federal bias in miniature: it misfires on exactly the
# members who also sat elsewhere.
#
# The flag is a mechanism, not a note. It makes the run corroborate every
# identifier match against the item's own name and birth date
# (`resolve.corroborates`), report how many it rejected, stamp every suggestion
# `identifier_unverified` so `quickstatements.is_mechanical` refuses it, and say
# in each ADD_IDENTIFIER that the value is unconfirmed. Two id spaces that
# overlap numerically match *exactly* and match the wrong people; this is what
# stands between that and a wrong edit.
#
# Flipping it needs section C to read CONFIRMED — 35 of 35, not 34 — and P14527
# put back into models.VERIFIED_IDENTIFIER_PROPERTIES in the same commit.
identifier_verified: false

# ---------------------------------------------------------------------------
# Both identifiers, because a member has two and they are not the same thing
# ---------------------------------------------------------------------------
# P14527 is the OpenParlData ID — a record in api.openparldata.ch, which is an
# aggregator that happens to be this config's source. P13468 is the *canton's
# own* member id, kept by the Staatsarchiv, and it is the cantonal analogue of
# P1307: 28 of the 35 linked ZH items already carry it.
#
# The join can only be one of them (see above: only P14527 has a value on both
# sides), and until now the report only ever mentioned the join. So a member's
# item could be missing P13468 for good and nothing here would ever say so.
# Listing both makes the run report each one it does not find:
#
#   P14527 -> ADD_IDENTIFIER,     value in hand (the source's person id)
#   P13468 -> MISSING_IDENTIFIER, no value: run 20 searched every column of
#             OpenParlData's person records and P13468's values are in none of
#             them. The reader looks the person up at wahlen.zh.ch and adds it.
#
# Neither is ever emitted as QuickStatements. Supplying a P13468 *value* means
# reading the canton's own dataset (README step 7) — the same thing that would
# let it be joined on.
identifiers: [P14527, P13468]

# One P39 statement per continuous tenure. Measured rather than assumed: the ZH
# memberships are one row per *tenure*, not per term as the federal ones are —
# 913 rows across 834 people, with each election adding only ~40-50 rows rather
# than 180 (run 15).
statement_model: tenure

# Group the report by electoral district — the Wahlkreis, for a cantonal body.
group_by: canton

# ---------------------------------------------------------------------------
# REPORT-ONLY for now
# ---------------------------------------------------------------------------
# Two reasons, either of which is sufficient:
#
#   1. the P14527 == person id equality above is 34 of 35, not 35 of 35, and
#      while it is, `identifier_verified: false` refuses every command anyway;
#   2. OpenParlData links only 35 of 834 ZH people to a Wikidata item (4.2%,
#      against 3,685 of 3,686 federally), so most members have no item at all
#      and the report is chiefly a worklist for *creating* them. There is very
#      little to emit mechanically even once the join is confirmed.
#
# The federal side began the same way. Turn this on only after a probe confirms
# the join and a human has pasted one line by hand (README step 5).
quickstatements: false

# The record the number beside each member in the report actually names.
#
# It used to be the Kantonsrat's own member list, https://kantonsrat.zh.ch/
# mitglieder/ — a page that knows nothing about the number it was linked from.
# The number is OpenParlData's person id, i.e. the P14527 value this config
# joins on, so the page that resolves it is OpenParlData's own. Left unset the
# tool would now derive exactly this from `identifier_property`; it is written
# out because the correspondence — printed number ↔ linked page — is the thing
# that was wrong, and a config that overrides this key owns it.
#
# The reports link here — including from the "Recorded as sitting, but the
# member has left" section, whose people are not in the members table at all
# and whose number is read off the identifier Wikidata itself carries.
#
# {person_number}, {id} and {language} are substituted.
biography_url: "https://openparldata.ch/item/persons/{person_number}"

# ---------------------------------------------------------------------------
# Chambers
# ---------------------------------------------------------------------------
# `council` is this tool's own short key for the chamber (it names the report
# file and groups the members); `group_id` is the OpenParlData `groups` row that
# *is* the chamber, measured at 5077 on 2026-07-30. `group_name` is the fallback
# if the id ever changes: it is matched by EXACT name, never as a substring,
# because "Büro des Kantonsrates" is an organ of the chamber and — far worse —
# the *Regierungsrat* is the cantonal executive, seven members, five letters
# away from the legislature.
#
# `position` is Q21518678, derived rather than guessed (run 14): of the members
# OpenParlData links to Wikidata, it is the cantonal seat they hold, and run 15
# confirmed it is held by 270 items with 167 of them current — 93% of the 180
# seats. An earlier candidate, Q19479543, turned out to be
# "Kategorie:Kantonsrat (Zürich, Person)", a Wikimedia CATEGORY held by nobody.
# Never put that back.
bodies:
  - council: KR
    label: Cantonal Council of Zürich
    position: Q21518678    # member of the Cantonal Council of Zürich
    group_id: 5077
    group_name: Kantonsrat Zürich

# ---------------------------------------------------------------------------
# Wahlkreise  ->  P768 electoral district (qualifier)
# ---------------------------------------------------------------------------
# Keyed by the person record's `electoral_district_de`, whitespace-normalised —
# the source spells them 'XVII Bülach', 'I Zürich 1+2' and so on, and all 18 are
# present across the 180 sitting members.
#
# EMPTY ON PURPOSE, and not for want of looking. Run 15 asked what P768 values
# Wikidata already carries on statements for this seat: **3 of 270 statements**,
# naming Kreis 4, Kreis 5 and Kreis 11 — *city of Zürich quarters*, not cantonal
# electoral districts. Three statements are not a convention to follow, and
# those three are not even the right kind of thing. Matching the 18 names to
# items by label instead would be exactly the guess that put a Wikimedia
# category in `position` above.
#
# So: an unmapped district makes no P768 suggestion, which is the safe default.
# Filling this in is a Wikidata-side job for a human, checked with
# `wd-parliament --verify-config`.
cantons: {}
  # "XVII Bülach": Q...
  # "XII Uster":   Q...

# Fraktionen -> P4100. Not yet sourced; the person records carry a party, not a
# parliamentary group.
parl_groups: {}

# Parties -> P102. The person records do carry a party, and 822 of 834 (98.6%)
# even carry a party Q-ID in `party_harmonized_wikidata_id` — a much better
# source than this map. Left empty until that field is read directly; an
# unmapped party produces no suggestion, and REVIEW_PARTY is never mechanical
# anyway.
parties: {}

# ---------------------------------------------------------------------------
# Personal data -> presence checks (README step 9)
# ---------------------------------------------------------------------------
# Which properties to report as missing when the source publishes them and the
# item carries no statement. Presence only, never a value comparison, and never
# emitted as QuickStatements — see config/parliament.yaml for the reasoning.
#
# MEASURED on 2026-08-04 (run 19). The ZH `persons` table carries an
# `occupation_de` and a `website_personal` — so unlike the federal source, this
# one can answer P106 and P856 — plus `party_de` for P102. It carries **no**
# birthplace, no Bürgerort and no children, so P19, P1321 and P1971 are not
# listed: there is nothing for them to compare.
#
#   P106  occupation        <- occupation_de (also _fr, _it)
#   P856  official website  <- website_personal
#   P102  member of party   <- party_de
#
# ⚠️ `website_parliament_url_de` is the member's page on the *chamber's* site,
# not a website of the person, and is deliberately not read as P856.
#
# P102 is the one that closes a real gap: `parties:` above is empty, so
# REVIEW_PARTY (which needs a mapped Q-ID) never fires, and this is the only
# check that notices a cantonal member with no P102 at all.
#
# Run 19 also found that this adapter had been reading the party from
# `party_name_de` and the birth date from `birthdate` — neither of which
# OpenParlData uses. Both are fixed in openparldata.py; that is what a probe
# printing the real column list buys you.
person_data: [P102, P106, P856]

# Legislative terms -> P2937. Empty, and there is nothing to fill it from yet:
# OpenParlData exposes no period table for ZH, so `get_periods` returns none and
# no P2937 is suggested at all. Run 15 also found P2937 on *no* statement for
# this seat, so there is no convention to copy either. The election dates are
# clearly visible in the data when someone wants to build a term list — the
# start dates cluster on 1991-05-06, 1995-04-02, 1999-05-31, 2003-05-19,
# 2007-05-21, 2011-05-09, 2015-05-18, 2019-05-06.
terms: {}
