# Gemeinderat der Stadt Zürich, read from OpenParlData.
#
# The first **municipal** parliament this tool reads, and the fourth config.
# It is the cantonal `kantonsrat-zh.yaml` one level down — same aggregator,
# same join property, same statement model — so read that file's header first
# and then the differences here.
#
# ── ⚠️ THIS CONFIG CANNOT PRODUCE MEMBERS YET ───────────────────────────────
#
# Run 34 (2026-08-18, verify.yml step 12) measured the source and found the
# blocker, which is **not** in this file:
#
#   * body `261` is the city of Zürich (`id=322, body_key='261',
#     name_de='Zürich'`) with **807 person records**;
#   * the chamber is a group under it, `id=8062, name_de='Gemeinderat'` — the
#     id the first draft configured was RIGHT, matched by exact name, with
#     `Büro des Gemeinderats` correctly rejected as a near miss;
#   * and that group returns **0 membership rows**.
#
# A seat is a `memberships` row pointing at the group, so with none there are
# no members, which is the "the source returned no sitting members for GR" the
# first `Update parliament TODO` dispatch ended on. Body key right, group id
# right, group name right, and no seats.
#
# `verify_kantonsrat.py` now walks a handful of this body's people and prints
# the group ids their own membership rows point at — the one question nobody
# had put to the source. Until that comes back naming a group, **do not run
# this config**: it will fail the same way. It stays in `update.yml`'s dispatch
# list so the failure is reproducible on demand, and out of nothing else.
#
# ── What run 34 DID settle ─────────────────────────────────────────────────
#
#   * the position item (section D, `--verify-config`): CONFIRMED;
#   * the identifier join (section C): CONFIRMED, 68 of 68;
#   * the electoral districts (section E): the source's own spellings, read
#     off the person records and now the keys below.
#
# Each is marked at its own key.

language: de
user_agent: "wd-parliament/0.1 (https://github.com/metaodi/wd-parliament; oderbolz@gmail.com)"
request_delay: 1.0

source: openparldata

# The city of Zürich as an OpenParlData *body* — a body is the level of
# parliament, so this is the municipality and the Gemeinderat is a group under
# it. `261` is the city's BFS municipality number, and the failed run confirms
# it resolves: 807 person records came back.
body_key: "261"

# P14527, the OpenParlData ID — the same join the cantonal config makes, and
# for the same reason: it is the only identifier this source can supply a
# *value* for. There is no municipal analogue of P1307 (federal) or P13468
# (canton of Zürich) on Wikidata at all, so unlike the cantonal file there is
# no second identifier to report either.
#
# ⚠️ Expect the coverage to be poor. P14527 matched **0 of the 180 sitting
# Kantonsrat members** on that config's first real run — the people OpenParlData
# links to Wikidata are the ones notable enough to have gone federal — and a
# city parliament is one level further from Bern again. Everything this config
# reports will therefore come from the name fallback, which `is_mechanical`
# refuses. That is the correct first release, not a fault.
identifier_property: P14527

# ⚠️ Run 34 measured this and returned **CONFIRMED, 68 of 68**: every P14527
# value Wikidata holds for a linked member of this body equals OpenParlData's
# person id. It is still `false`, and `config.load_config` would refuse `true`
# anyway, because P14527 is not in `models.VERIFIED_IDENTIFIER_PROPERTIES` —
# and it is out of that set for a reason a clean run cannot retire. Run 20
# found 34 of 35 cantonally, and the one that differs (`Q131948095` carrying
# 1411 where that body's record is 17436) is a person who **also sat
# elsewhere**: OpenParlData keeps one record per person per body, so the
# property identifies a person *record*, not a person. 68 of 68 on one body's
# linked sample is evidence, not the retirement of a known failure mode — and
# the members it misfires on are exactly the ones this sample over-represents.
#
# What `false` buys meanwhile: `resolve.corroborates` checks every identifier
# match against the item's own name and birth date, `Member.identifier_mismatch_qids`
# records the rejects, and `is_mechanical` refuses every suggestion the join
# produced. Flipping it is a decision for a human with both runs in view.
identifier_verified: false

# Only the join property: no other identifier property in
# `models.IDENTIFIER_PROPERTIES` describes a member of this chamber, so there
# is no second one to raise MISSING_IDENTIFIER for. (Contrast
# `kantonsrat-zh.yaml`, which lists P13468 beside P14527 precisely because the
# canton has an id of its own that an item ought to carry.)
identifiers: [P14527]

# `biography_url` is deliberately **absent**, so it defaults to the join
# property's own record page (`https://openparldata.ch/item/persons/{id}`).
#
# ⚠️ The first draft pointed it at `gemeinderat-zuerich.ch/mitglieder/detail.php
# ?gid={obj_guid}`, which is wrong twice over: `{obj_guid}` is not a field this
# template is given — `Config.biography_url_for` supplies `{person_number}` /
# `{id}` / `{language}` and nothing else, so it raised `KeyError: 'obj_guid'`
# the moment a report was written — and the number the report prints beside a
# member is a **P14527** value, which the city's own member list has never
# heard of. The URL template belongs to the property whose value is printed;
# see `models.IDENTIFIER_PROPERTIES`.

# ⚠️ OFF, and doubly so. `identifier_verified: false` already refuses every
# command on its own, and nothing about this parliament has been verified: not
# the group, not the position item, not the districts. Turning this on is a
# decision to be made after the probe dispatch and after a human has pasted one
# line into QuickStatements by hand (README step 5).
quickstatements: false

# One P39 statement per *tenure*, not one per term — the same shape
# `kantonsrat-zh.yaml` reads, and for the same reason: OpenParlData's
# membership rows are per tenure, and this source has no legislative periods at
# all. Leaving it at the default (`period`) is not a smaller claim but a silent
# nothing: `expected_statements` would return an empty list and the run would
# emit no seat suggestion while reporting success.
statement_model: tenure

# Group the report by electoral district — the Wahlkreis.
group_by: constituency

bodies:
  - council: GR
    label: Gemeinderat der Stadt Zürich
    # CONFIRMED by run 34, both ways round. `--verify-config` reads
    # 'Mitglied des Gemeinderates der Stadt Zürich', instance of **Position**
    # — not a Wikimedia category, which is the trap that cost run 13 a whole
    # cantonal dispatch — and section D counts 22 holders, 4 of them current.
    # Section D also *derived* the candidates independently from the 68 members
    # OpenParlData links to Wikidata, and this item is second there at 11 of 68.
    # The top of that list is the **National Council** at 35 of 68, which is
    # the sampling skew this repo has now been bitten by at every level: the
    # municipal members with Wikidata items are disproportionately the ones who
    # went on to Bern. Read the list, never take the max.
    position: Q111219780
    # Kept as measured: run 34 found the chamber by exact name at exactly this
    # id, so the config and the source agree. Both are given, so the id is used
    # and costs no request; the name is what a re-measurement checks it
    # against. Equality, never substring — the **Stadtrat** is the city's
    # nine-member executive and `Büro des Gemeinderats` (id 519, correctly
    # rejected as a near miss) is an organ of the chamber.
    group_id: 8062
    group_name: Gemeinderat

# The 9 Wahlkreise the city elects its 125 members from.
#
# **The keys are the source's own spelling**, read off `electoral_district_de`
# by run 34 section E and not invented: the city writes `1 und 2`, not
# `Wahlkreis Zürich 1+2`. The first draft used the latter, so all nine entries
# were unreachable — eighteen-entries-zero-lookups again, the failure
# `Config.constituency_qid`'s case folding was added for and which folding
# cannot fix, because these are different words rather than different casing.
#
# ⚠️ The same section found **17** distinct values on the 807 person records,
# not 9. The eight extras are other parliaments' districts — `Zürich` (35, the
# federal canton-as-district), `I Zürich 1+2` … `VI Zürich 11+12` (the
# Kantonsrat's own Roman-numbered Wahlkreise) and one `Baden` — because
# OpenParlData keeps the district on the **person**, and a person who also sat
# cantonally or federally carries that seat's district here. They are
# deliberately absent from this map: an unmapped district makes no suggestion,
# which is the right answer, and mapping one would put another parliament's
# electoral district on a Gemeinderat statement.
#
# The Q-IDs were checked by `--verify-config` in the same run and every one of
# them is classed **`Wahlkreis der Stadt Zürich`**, which is what makes the
# mixture below correct rather than the error it looks like: where a Wahlkreis
# spans two Kreise the city has its own item (`Wahlkreis Stadt Zürich 1+2`,
# also a `Wahlkreis Kanton Zürich` because the territory coincides), and where
# it is a single Kreis the *Kreis* item carries the class (`Kreis 3`
# [Wohnviertel, Wahlkreis, Kreise der Stadt Zürich, Wahlkreis der Stadt
# Zürich]). Q117787885 is corroborated from the other side too: it is the one
# P768 value already in use on a statement for this seat.
#
# Section E still reports CONTRADICTED, and that is the probe being right about
# its own method rather than about this map — it reconciles by **exact label**,
# and `4 und 5` is not the label of `Wahlkreis Stadt Zürich 4+5`. Aligning them
# on the digits is precisely what run 31 did cantonally and got five-sixths
# wrong. These nine were aligned on the place both sides name.
constituencies:
  "1 und 2": Q117787833     # Wahlkreis Stadt Zürich 1+2
  "3": Q675017              # Kreis 3
  "4 und 5": Q117787885     # Wahlkreis Stadt Zürich 4+5  (already a P768 value here)
  "6": Q456170              # Kreis 6
  "7 und 8": Q117787912     # Wahlkreis Stadt Zürich 7+8
  "9": Q456159              # Kreis 9
  "10": Q456175             # Kreis 10
  "11": Q870098             # Kreis 11
  "12": Q657525             # Kreis 12

# Empty on purpose. A municipal party section is often a different item from
# the cantonal one of the same name, which is in turn often different from the
# federal one — mapping "SP" to the national party would put a wrong statement
# on dozens of people at once. An unmapped party makes no suggestion, which is
# the correct answer until each one is checked.
parties: {}

# OpenParlData's membership rows carry a role, not a parliamentary group, and
# nothing has been read here yet.
parl_groups: {}

# No legislative periods in this source, so no P2937 is ever suggested whatever
# stands here.
terms: {}

# ⚠️ STILL UNVERIFIED for this body. Run 34's step 9 could not measure them:
# `verify_person_data.py` reads the members, and this body produces none.
# These are the checks OpenParlData answered for the *canton*
# (run 19): P106 from `occupation_de`, P856 from `website_personal`, P102 from
# `party_de`. Whether the city's records carry the same columns is a different
# question — `scripts/verify_person_data.py --config config/gemeinderat-zuerich.yaml`
# is what answers it, and a listed property with no source column simply makes
# no suggestion. The three that are absent here are absent from this source
# everywhere: it carries no birthplace (`city`/`street` are a postal address
# and must never be read as one), no Bürgerort and no number of children.
person_data: [P102, P106, P856]

# ── Enrichment ──────────────────────────────────────────────────────────────
#
# A *second* source, read only to contradict this one; it produces no members
# and a disagreement can only withhold a mechanical edit, never supply a value.
#
# None is configured yet, and `gever` is not yet a value `config.SOURCES`
# accepts. What changed with **swissparlpy 2.1** (now the floor in
# `pyproject.toml`) is that the client can reach it at all: `backends/gever.py`
# ships, and `gever_config.INSTANCES` carries **`city_zurich`** beside the
# canton's — `https://www.gemeinderat-zuerich.ch` with `/api/kontakt`,
# `/api/behoerdenmandat`, `/api/wahlkreis`, `/api/partei`. So the city's own
# Gever is reachable as `SwissParlClient(backend="gever_city_zurich")`.
#
# Note it is shaped differently from the canton's, which has one `MITGLIEDER`
# index: here the person (`kontakt`) and the mandate (`behoerdenmandat`) are
# separate. That matters, because a `behoerdenmandat` row is the thing that is
# missing from OpenParlData for this body.
#
# Two things have to be measured before an enricher is written, and neither is
# guessable:
#
#   * **the columns**, read from the service and not from a client's
#     normalised output. Run 22 spent a whole dispatch reporting "3,862 rows
#     with no name" because the field names came from `goifer`'s flat output
#     while the probe read raw XML.
#   * **the join.** `enrich.OpenParlDataEnricher` joins through the source's
#     own `wikidata_id`; Gever has none, and run 23 established that no
#     Wikidata property holds a Gever GUID at all. So a Gever cross-check is
#     name-matched throughout, and run 24 showed its person-level key
#     (`person_kontakt_obj_guid`, cantonally) is *nearly* a person key and not
#     one — 3 genuinely split people — so it would need duplicate handling of
#     its own rather than inheriting `resolve`'s.
#
# And one thing to keep in view about what it would buy today: under
# `identifier_verified: false` **nothing here is mechanical**, so a
# disagreement has nothing left to withhold. A Gever cross-check would show up
# in the report and change no output — which is a reason to measure it now and
# a reason not to call it a blocker.
