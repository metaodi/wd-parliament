# Gemeinderat der Stadt Zürich, read from the city's own Gever.
#
# The first **municipal** parliament this tool reads, the fourth config, and
# the first whose source is not an aggregator at all — because for this
# parliament the aggregator has no seats.
#
# ── Why the source is the Gever and not OpenParlData ────────────────────────
#
# Run 34 (2026-08-18) measured OpenParlData for this chamber and found:
#
#   * body `261` is the city of Zürich (`id=322, legislative_seats=125`) with
#     **807 person records**;
#   * two groups under it name the chamber — `id=8062, 'Gemeinderat'` and
#     `id=465, 'Gemeinderat Zürich'`;
#   * group 8062, the one the first draft configured, holds **0 membership
#     rows**. The people are there and the mandates are not.
#
# Run 35 then measured the city's own Geschäftsverwaltungssystem, reachable
# since **swissparlpy 2.1** as `gever_city_zurich`, and it carries exactly
# what was missing: `behoerdenmandat`, 3,700 rows over 61 Gremien, every one
# dated, **870** of them naming the Gemeinderat. Run 36 closed the seat count
# at 125.
#
# It is also better in one respect than OpenParlData would have been if it had
# worked: the **electoral district is on the mandate** (`wahlkreis`, 3,360 of
# 3,700), not on the person. OpenParlData keeps it on the person, which is why
# body 261 shows 17 districts for 9 seats — somebody who also sat cantonally
# carries that seat's district there.
#
# ── What this source cannot do ─────────────────────────────────────────────
#
# **It has no identifier any Wikidata property holds.** Run 23 searched every
# field of the canton's Gever for P13468 and found it nowhere; run 35 found six
# GUID columns for the city and none of them a property's value. So
# `identifier_from_source: false`, every member is matched **by name**, and
# `quickstatements.is_mechanical` refuses everything. That is the correct first
# release and exactly where the federal side began — not a defect.
#
# **Its birth data is a year** (`jahrgang`, `'1936'`), not a date. `gever.py`
# deliberately does not map it to `date_of_birth`: a 1 January is a precision
# this source never claimed, and it would make the name fallback confidently
# wrong about two namesakes instead of honestly uncertain.
#
# **It has no legislative periods**, so no P2937 is ever suggested.

language: de
user_agent: "wd-parliament/0.1 (https://github.com/metaodi/wd-parliament; oderbolz@gmail.com)"
request_delay: 1.0

source: gever

# The CDWS instance, as `swissparlpy.client.GEVER_INSTANCES` names it. An
# instance carries a whole index map (`/api/kontakt`, `/api/behoerdenmandat`,
# `/api/wahlkreis`, `/api/partei`, …), which is why this is a name and not a
# URL.
gever_backend: gever_city_zurich

# P14527, the OpenParlData ID. **Reported, never joined on.** There is no
# municipal analogue of P1307 or P13468 on Wikidata, and this source supplies
# no value for P14527 either — so it appears in the report as
# MISSING_IDENTIFIER, without a number, which is the only honest thing to say
# about it. See `identifier_from_source`.
identifier_property: P14527

# ⚠️ THE LOAD-BEARING FLAG OF THIS CONFIG.
#
# `false` says the source publishes no value for the property above — a fact
# about the Gever, which `config.load_config` derives and would refuse to have
# contradicted. Its person key is an internal GUID (`kontaktguid`), and a GUID
# is the value of nothing.
#
# What it buys: `resolve` makes no identifier join at all, so a chance
# collision between two id spaces can never wear `QID_FROM_IDENTIFIER`
# provenance — the provenance `is_mechanical` trusts. And `diff` raises
# MISSING_IDENTIFIER instead of ADD_IDENTIFIER, so no run ever offers a Gever
# GUID as a P14527 value: that would be a number from the wrong id space,
# written confidently onto a real item, where no later run could detect it.
identifier_from_source: false

# Follows from the above and may not be claimed otherwise: a value that does
# not exist cannot have been measured.
identifier_verified: false

# Only the join property. No other identifier in `models.IDENTIFIER_PROPERTIES`
# describes a member of this chamber, and listing one would assert a register
# that does not exist.
identifiers: [P14527]

# The member's page in the city's own Ratsinformationssystem.
#
# `{id}` **is** `kontakt.obj_guid` here — the person GUID this service keys
# people by, which a mandate row points at through `kontaktguid` and which
# `gever.person_key` puts in `Member.person_number`. So the number the report
# prints beside a member and the number in this URL are the same one, which is
# the correspondence `models.IDENTIFIER_PROPERTIES` exists to keep.
#
# ⚠️ Only `{person_number}`, `{id}` and `{language}` are substituted, whatever
# the source calls the field. The first draft of this file wrote `{obj_guid}`
# and raised `KeyError: 'obj_guid'` the moment a report was written — the
# template is `Config.biography_url_for`'s contract, not the source's column
# list.
#
# Note this is NOT the join property's record page, and could not be: with
# `identifier_from_source: false` there is no P14527 value to link, and
# `biography_url_for` would otherwise return nothing at all rather than send a
# reader to a page that cannot resolve a GUID.
biography_url: "https://www.gemeinderat-zuerich.ch/mitglieder/detail.php?gid={id}"

# ⚠️ OFF, and doubly so. `identifier_verified: false` already refuses every
# command on its own, and nothing about this parliament has been verified: not
# the group, not the position item, not the districts. Turning this on is a
# decision to be made after the probe dispatch and after a human has pasted one
# line into QuickStatements by hand (README step 5).
quickstatements: false

# One P39 statement per *tenure*, not one per term — the same shape
# `kantonsrat-zh.yaml` reads, and for the same reason: OpenParlData's
# membership rows are per tenure, and this source has no legislative periods at
# all. Leaving it at the default (`period`) is not a smaller claim but a silent
# nothing: `expected_statements` would return an empty list and the run would
# emit no seat suggestion while reporting success.
statement_model: tenure

# Group the report by electoral district — the Wahlkreis.
group_by: constituency

bodies:
  - council: GR
    label: Gemeinderat der Stadt Zürich
    # CONFIRMED by run 34, both ways round. `--verify-config` reads
    # 'Mitglied des Gemeinderates der Stadt Zürich', instance of **Position**
    # — not a Wikimedia category, the trap that cost run 13 a whole cantonal
    # dispatch — and section D counts 22 holders, 4 of them current. Section D
    # also derived the candidates independently from the 68 members
    # OpenParlData links to Wikidata, where this item is second at 11 of 68.
    # The top of that list is the **National Council** at 35 of 68: the
    # sampling skew this repo has now met at the federal, cantonal and
    # municipal level. Read the list, never take the max.
    position: Q111219780
    # The `gremium` value that IS this chamber, matched by **EXACT** name.
    # Run 35: 870 of the 3,700 mandate rows carry it. Equality is not
    # fastidiousness here — the city's **Stadtrat**, its nine-member
    # executive, appears *inside the council's own mandate list* as
    # `Mitglied Stadtrat` / `Präsidium Stadtrat`, `Büro des Gemeinderats` is
    # an organ of the chamber, and the parties (`SP`, `FDP`, `SVP`, …) are
    # modelled as Gremien too. A substring match takes all of them.
    group_name: Gemeinderat

# The 9 Wahlkreise the city elects its 125 members from.
#
# **The keys are the source's own spelling, and run 37 confirmed them.** The
# first live run against the Gever grouped all 125 members under exactly these
# nine — `1 und 2` (12), `3` (14), `4 und 5` (13), `6` (11), `7 und 8` (17),
# `9` (17), `10` (13), `11` (22), `12` (9) — with nothing left over. The city
# spells them the same way in its Gever as OpenParlData does, which was worth
# checking rather than assuming: the first draft of this file used `Wahlkreis
# Zürich 1+2` and all nine entries were unreachable.
#
# The Q-IDs themselves are checked: `--verify-config` (run 34) resolved all
# nine and every one is classed **`Wahlkreis der Stadt Zürich`**. That is what
# makes the apparent mixture right rather than the error it looks like — where
# a Wahlkreis spans two Kreise the city has its own item (`Wahlkreis Stadt
# Zürich 1+2`, also a `Wahlkreis Kanton Zürich` because the territory
# coincides), and where it is a single Kreis the *Kreis* item carries the
# class. Q117787885 is corroborated from the other side too: it is the one
# P768 value already in use on a statement for this seat.
constituencies:
  "1 und 2": Q117787833     # Wahlkreis Stadt Zürich 1+2
  "3": Q675017              # Kreis 3
  "4 und 5": Q117787885     # Wahlkreis Stadt Zürich 4+5  (already a P768 value here)
  "6": Q456170              # Kreis 6
  "7 und 8": Q117787912     # Wahlkreis Stadt Zürich 7+8
  "9": Q456159              # Kreis 9
  "10": Q456175             # Kreis 10
  "11": Q870098             # Kreis 11
  "12": Q657525             # Kreis 12

# Empty on purpose. A municipal party section is often a different item from
# the cantonal one of the same name, which is in turn often different from the
# federal one — mapping "SP" to the national party would put a wrong statement
# on dozens of people at once. An unmapped party makes no suggestion, which is
# the correct answer until each one is checked.
parties: {}

# OpenParlData's membership rows carry a role, not a parliamentary group, and
# nothing has been read here yet.
parl_groups: {}

# No legislative periods in this source, so no P2937 is ever suggested whatever
# stands here.
terms: {}

# The personal data this source publishes, measured by run 35 on 708 `kontakt`
# records:
#
#     beruf           134/708   -> P106
#     homepageprivat   65/708   -> P856
#     partei          674/708   -> P102
#
# P19, P1321 and P1971 are absent from this source entirely — no birthplace, no
# Bürgerort, no children — so listing them would assert a check that cannot
# fire. `jahrgang` (537/708) is a birth **year** and is deliberately not read:
# see the header.
#
# None of these is ever mechanical (`ADD_PERSON_DATA` is outside
# `MECHANICAL_KINDS` and its payload carries no position), so nothing here can
# reach `suggestions.qs` whatever the coverage.
person_data: [P102, P106, P856]

# ── Enrichment: OpenParlData, read only to contradict ───────────────────────
#
# The roles are now the reverse of what this config started as, and that is the
# point: OpenParlData cannot *source* this chamber (no mandates), but it is a
# perfectly good second opinion about the members the Gever produces. Bounded
# structurally by `enrich`: it makes no `Member`, so it cannot become the
# source by accident, and a disagreement can only **withhold** a mechanical
# edit — never supply a value.
#
# ⚠️ It withholds nothing today, and that is expected. Under
# `identifier_from_source: false` every member is name-matched, so nothing is
# mechanical and a disagreement has nothing left to suppress. What it does do
# is put the disagreement in the **report**, where somebody can look at it —
# and it is ready for the day a joinable identifier exists.
#
# `body_key` is the city; the group is matched by **exact name**, and the name
# below is `Gemeinderat Zürich` — **not** `Gemeinderat`. Run 34 found two
# groups under body 261 naming this chamber, and the one the first draft of
# this file configured (`id=8062, 'Gemeinderat'`) is the one holding **zero**
# membership rows. `id=465, 'Gemeinderat Zürich'` is the one with the data.
# Two groups for one chamber is a fact about the source; picking the wrong one
# is silent, because an empty enrichment looks exactly like an enrichment that
# agrees with everything.
enrich:
  source: openparldata
  body_key: "261"
  groups:
    GR: Gemeinderat Zürich
