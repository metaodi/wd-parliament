name: Verify assumptions

# A read-only diagnostic, not a build. It answers the questions under "Open
# verification steps" in the README that need live network access:
#
#   1. can the sitting members be read from parlament.ch at all, and if not,
#      which filter empties the list? (The run of 2026-07-29 read zero members
#      and published 2,234 wrong suggestions off the back of it.)
#   2. does Wikidata's P1307 really hold MemberCouncil.PersonNumber?
#   3. do the hand-maintained Q-ID maps in config/parliament.yaml resolve to
#      the items they claim to?
#
# It also runs seven things that report without gating:
#
#   * whether swissparlpy's OpenParlData backend could source this tool's
#     data, and whether P14527 is a better join key than P1307 — a "no" there
#     is an answer about a design option, not a broken pipeline;
#   * README step 0c, comparing both the raw MemberCouncil.DateJoining and
#     the tenure start the tool actually emits as P580 against OpenParlData's
#     seat memberships. A disagreement blocks a *bulk apply* of
#     ADD_MEMBERSHIP / ADD_START_DATE, since both are mechanical, but it does
#     not stop reports being generated — which is what this job's pass/fail
#     decides. Read it before applying QuickStatements;
#   * README step 4, comparing the legislative-period overlap against who
#     actually voted in a roll-call. It decides P2937, and `terms:` ships
#     empty, so today nothing it could falsify is emitted at all;
#   * README step 8, measuring the people Wikidata still records as sitting
#     whom the source does not list. The report now names their leaving date,
#     and this asks whether that date could be *applied* — a question about
#     removing the report-only gates in `diff`, not about generating reports.
#     Its INCONCLUSIVE is the expected answer when Wikidata is tidy;
#   * README step 7, measuring whether the tool could be pointed at a cantonal
#     parliament (the Kantonsrat Zürich). It concerns a parliament this repo
#     does not yet process at all, so it cannot gate anything here by
#     construction;
#   * README step 9, measuring whether the source really carries the personal
#     data (P19, P1321, P106, P102, P856, P1971) the presence checks ask for,
#     and how many suggestions each one would make. Those suggestions are
#     never mechanical, so nothing it measures can reach suggestions.qs;
#   * README step 10, asking whether the canton of Zürich's own Gever can
#     supply P13468 — the property run 20 found OpenParlData cannot. It reads
#     a service no config here names, so like step 7 it cannot bear on any
#     pipeline run by construction;
#   * README step 11, asking the same of the Staatsarchiv's own KRRR export —
#     "Kantonsrat und Regierungsrat", the two bodies P13468 names. It also
#     re-measures P13468's formatter URL, which this repo has been asserting
#     without ever checking.
#
# Deliberately NOT what "Update parliament TODO" does: nothing is generated,
# nothing is committed, and nothing is published. Run this before trusting
# that workflow's output.

on:
  workflow_dispatch:
    inputs:
      last_name:
        description: "Surname to look up on parlament.ch"
        required: false
        default: "Parmelin"
      expect_person_number:
        description: "The P1307 value Wikidata holds for that person"
        required: false
        default: "1108"
      openparldata_sample_name:
        description: "A sitting National Councillor, to sample OpenParlData memberships"
        required: false
        default: "Andrey"
      vote_ids:
        description: "IdVote numbers for the period cross-check, space separated ('auto' discovers them)"
        required: false
        default: "auto"
      kantonsrat_body_key:
        description: "OpenParlData body key for the canton (step 7)"
        required: false
        default: "ZH"
      kantonsrat_position:
        description: "Q-ID for the Kantonsrat seat (blank = only discover candidates)"
        required: false
        default: "Q21518678"

# Read-only on purpose. This workflow must never write to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      # Both checks run even when the first one fails: one dispatch should
      # answer both questions, not stop at the first bad news.
      - name: Probe the parlament.ch source and the P1307 join
        id: source
        continue-on-error: true
        env:
          # Via env rather than inline ${{ }}, so a surname can never be
          # interpolated into the shell.
          LAST_NAME: ${{ inputs.last_name }}
          EXPECT: ${{ inputs.expect_person_number }}
        run: |
          set +e
          uv run python scripts/verify_source.py \
            --config config/parliament.yaml \
            --last-name "$LAST_NAME" \
            --expect "$EXPECT" 2>&1 | tee source.txt
          status=${PIPESTATUS[0]}
          {
            echo "## 1. parlament.ch source and the P1307 join"
            echo
            echo '```'
            cat source.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Verify the configured Q-IDs
        id: qids
        continue-on-error: true
        run: |
          set +e
          uv run python -m wd_parliament \
            --config config/parliament.yaml --verify-config 2>&1 | tee qids.txt
          status=${PIPESTATUS[0]}
          {
            echo "## 2. Configured Q-IDs"
            echo
            echo '```'
            cat qids.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # An evaluation, not a check. Its outcome is deliberately absent from
      # the job result below: whether OpenParlData suits this tool is a design
      # question, and a "no" must not turn the diagnostic red.
      - name: Evaluate the OpenParlData backend and P14527
        id: openparldata
        continue-on-error: true
        env:
          SAMPLE_NAME: ${{ inputs.openparldata_sample_name }}
        run: |
          set +e
          uv run python scripts/verify_openparldata.py \
            --config config/parliament.yaml \
            --last-name "$SAMPLE_NAME" 2>&1 | tee openparldata.txt
          {
            echo "## 3. OpenParlData backend (evaluation only)"
            echo
            echo '```'
            cat openparldata.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 0c: does MemberCouncil.DateJoining agree with OpenParlData's
      # per-term begin_date? Both kinds that emit P580 are mechanical, so a
      # disagreement blocks a bulk apply — but not the generation of reports,
      # which is what this job's pass/fail is about. Reports, does not gate.
      - name: Compare the tenure start dates (step 0c)
        id: tenure
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/compare_tenure_dates.py \
            --config config/parliament.yaml 2>&1 | tee tenure.txt
          {
            echo "## 4. Tenure start dates — README step 0c"
            echo
            echo '```'
            cat tenure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 4: does the interval overlap agree with who actually voted?
      # Reports, does not gate — for a different reason than the two above.
      # P2937 is the qualifier this decides, `terms:` in the config ships empty,
      # and the tool skips unknown values, so nothing this check could falsify
      # currently reaches QuickStatements at all. It gates a *bulk apply* the
      # day that map is filled in, not the generation of reports.
      #
      # VOTE_IDS is unquoted on purpose: several IdVotes are several arguments.
      # It reaches argparse, not a shell command, and anything that is neither a
      # number nor 'auto' is rejected there rather than silently ignored.
      - name: Cross-check the period join (step 4)
        id: periods
        continue-on-error: true
        env:
          VOTE_IDS: ${{ inputs.vote_ids }}
        run: |
          set +e
          uv run python -m wd_parliament \
            --config config/parliament.yaml \
            --validate-periods $VOTE_IDS 2>&1 | tee periods.txt
          {
            echo "## 5. Legislative-period join — README step 4"
            echo
            echo '```'
            cat periods.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 8: may the departed members' P582 be applied in bulk?
      # Reports, does not gate — the third variety of "does not gate" in this
      # file. The suggestions it measures are report-only *by construction*
      # (two gates in diff._departed_suggestion), so nothing it could falsify
      # reaches QuickStatements today; what a CONFIRMED here would license is
      # removing those gates, which is a deliberate act, not a run.
      #
      # INCONCLUSIVE is the expected answer on tidy data: the population is
      # whatever Wikidata has left open for people who have gone, and a small
      # one is good news about the data rather than a failed probe. That is why
      # this step must never gate the job.
      - name: Check the departed members' leaving dates (step 8)
        id: departures
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/verify_departures.py \
            --config config/parliament.yaml 2>&1 | tee departures.txt
          {
            echo "## 6. Departed members' leaving dates — README step 8"
            echo
            echo '```'
            cat departures.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 7: could this tool be pointed at a cantonal parliament?
      # Reports, does not gate — and for the plainest reason of the three: it
      # measures the Kantonsrat Zürich, which no config here processes, so
      # nothing it finds can make the federal pipeline more or less safe to
      # run. Its "no" answers are design findings (ship report-only, use a
      # different position item), not faults.
      #
      # The position Q-ID is UNVERIFIED and section D of the probe is what
      # checks it; passing it as an input is what lets a dispatch try another
      # candidate without a commit.
      - name: Evaluate a cantonal extension — Kantonsrat Zürich (step 7)
        id: kantonsrat
        continue-on-error: true
        env:
          # Via env rather than inline ${{ }}, so neither value can be
          # interpolated into the shell.
          BODY_KEY: ${{ inputs.kantonsrat_body_key }}
          POSITION: ${{ inputs.kantonsrat_position }}
        run: |
          set +e
          uv run python scripts/verify_kantonsrat.py \
            --config config/parliament.yaml \
            --body-key "$BODY_KEY" \
            --position "$POSITION" 2>&1 | tee kantonsrat.txt
          {
            echo "## 7. Cantonal extension — README step 7 (evaluation only)"
            echo
            echo '```'
            cat kantonsrat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 9: do the personal-data checks have a source, and how much
      # work would each one create? Reports, does not gate — for the same
      # reason as step 8 but more strongly: ADD_PERSON_DATA is not in
      # MECHANICAL_KINDS at all, so nothing it measures can ever reach
      # suggestions.qs. A CONTRADICTED here means a property listed in
      # `person_data:` has no source column and is quietly making no
      # suggestions, which is a tidiness finding, not a fault.
      #
      # Runs for both configs: the cantonal source's person columns are
      # entirely unmeasured, and this is the probe that would name them.
      - name: Measure the personal-data checks (step 9)
        id: persondata
        continue-on-error: true
        run: |
          set +e
          for cfg in config/parliament.yaml config/kantonsrat-zh.yaml; do
            echo "### $cfg"
            uv run python scripts/verify_person_data.py --config "$cfg" 2>&1
          done | tee persondata.txt
          {
            echo "## 8. Personal-data checks — README step 9"
            echo
            echo '```'
            cat persondata.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 10: can the canton's own Gever supply P13468? Reports, does
      # not gate, for the same reason as step 7 and one more: it reads a
      # service (parlzhcdws.cmicloud.ch) that no config here names at all, so
      # its answer cannot change what any pipeline run does. What a CONFIRMED
      # would license is a *new adapter*, which is a decision, not a run.
      #
      # A CONTRADICTED is the informative outcome and the one to expect:
      # P13468's register is the Staatsarchiv's, and being the canton's own
      # system is not the same as publishing the canton's own member id.
      - name: Probe the canton's Gever for P13468 (step 10)
        id: gever
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/verify_gever.py \
            --config config/kantonsrat-zh.yaml 2>&1 | tee gever.txt
          {
            echo "## 9. Gever of the canton of Zürich — README step 10"
            echo
            echo '```'
            cat gever.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 11: does the Staatsarchiv's own KRRR application export
      # carry P13468? KRRR is "Kantonsrat und Regierungsrat" — the two bodies
      # the property names — so it is the strongest candidate yet, and that is
      # precisely why it is measured: three sources have now been "the
      # authoritative source" and supplied the value none of the times.
      #
      # Reports, does not gate, for the same reason as steps 7 and 10: no
      # config here names this service. Its section D also re-measures
      # something this repo asserts about itself — P13468's formatter URL,
      # which was written down once and never checked.
      - name: Probe the Staatsarchiv's KRRR export for P13468 (step 11)
        id: krrr
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/verify_krrr.py \
            --config config/kantonsrat-zh-krdaten.yaml 2>&1 | tee krrr.txt
          {
            echo "## 10. Staatsarchiv KRRR export — README step 11"
            echo
            echo '```'
            cat krrr.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise and set the job result
        run: |
          source_step="${{ steps.source.outcome }}"
          qids="${{ steps.qids.outcome }}"
          {
            echo "## Result"
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| parlament.ch source + P1307 join | \`$source_step\` |"
            echo "| Configured Q-IDs | \`$qids\` |"
            echo "| OpenParlData evaluation | \`${{ steps.openparldata.outcome }}\` (does not gate) |"
            echo "| Tenure start dates (0c) | \`${{ steps.tenure.outcome }}\` (does not gate) |"
            echo "| Period join (step 4) | \`${{ steps.periods.outcome }}\` (does not gate) |"
            echo "| Departed members' dates (step 8) | \`${{ steps.departures.outcome }}\` (does not gate) |"
            echo "| Cantonal extension (step 7) | \`${{ steps.kantonsrat.outcome }}\` (does not gate) |"
            echo "| Personal-data checks (step 9) | \`${{ steps.persondata.outcome }}\` (does not gate) |"
            echo "| Gever / P13468 (step 10) | \`${{ steps.gever.outcome }}\` (does not gate) |"
            echo "| KRRR export / P13468 (step 11) | \`${{ steps.krrr.outcome }}\` (does not gate) |"
            echo
            if [ "$source_step" = "success" ] && [ "$qids" = "success" ]; then
              echo "Both gating checks passed: the members are readable, the"
              echo "identifier join is verified, and every configured Q-ID resolves"
              echo "— read the labels above to confirm they name what you meant."
              echo "Before *applying* anything, read section 4's second verdict"
              echo "(P580 as emitted), section 5, and — if you are thinking of"
              echo "ungating the departed members — section 6. The only step left that"
              echo "nothing here can do for you is step 5: paste one line into"
              echo "QuickStatements by hand and check it lands."
            else
              echo "At least one check failed — see the detail above. Do not run"
              echo "\"Update parliament TODO\" or apply any QuickStatements until"
              echo "both are green."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$source_step" = "success" ] && [ "$qids" = "success" ]
