name: Verify assumptions

# A read-only diagnostic, not a build. It answers the questions under "What has
# been verified" and "Open verification steps" in the README that need live
# network access.
#
# Two of them gate the job, and they are the two that say whether the pipeline
# may run at all:
#
#   1. can the sitting members be read from parlament.ch, and if not, which
#      filter empties the list? (The run of 2026-07-29 read zero members and
#      published 2,234 wrong suggestions off the back of it.) The same step
#      re-checks that Wikidata's P1307 holds MemberCouncil.PersonNumber;
#   2. do the hand-maintained Q-ID maps in config/parliament.yaml resolve to
#      the items they claim to?
#
# The other five report without gating, and each for its own reason:
#
#   * README step 0c compares both the raw MemberCouncil.DateJoining and the
#     tenure start the tool actually emits as P580 against OpenParlData's seat
#     memberships. A disagreement blocks a *bulk apply* of ADD_MEMBERSHIP /
#     ADD_START_DATE, since both are mechanical, but it does not stop reports
#     being generated — which is what this job's pass/fail decides. Its first
#     verdict is a standing CONTRADICTED by design: it records why P580 is not
#     read from DateJoining. Read the second one before applying anything;
#   * README step 4 compares the legislative-period overlap against who
#     actually voted in a roll-call. It decides P2937, and `terms:` ships
#     empty, so today nothing it could falsify is emitted at all;
#   * README step 8 measures the people Wikidata still records as sitting whom
#     the source does not list. The report names their leaving date, and this
#     asks whether that date could be *applied* — a question about removing the
#     report-only gates in `diff`, not about generating reports. Its
#     INCONCLUSIVE is the expected answer when Wikidata is tidy;
#   * README step 7 measures the cantonal config (the Kantonsrat Zürich). No
#     verdict about a cantonal parliament can make the federal pipeline more or
#     less safe to run;
#   * README step 9 measures whether each source really carries the personal
#     data (P19, P1321, P106, P102, P856, P1971) the presence checks ask for,
#     and how many suggestions each one would make. Those suggestions are never
#     mechanical, so nothing it measures can reach suggestions.qs.
#
# `scripts/verify_openparldata.py` was wired in here until every one of its
# verdicts was settled (README step 6: the backend can source P39, and P14527
# adds nobody federally). It is now run by hand — after a swissparlpy upgrade
# in particular, since its section E is what measures the library's defaults.
# The cantonal step still reads OpenParlData live through swissparlpy on every
# dispatch, so a source or library regression does not go unnoticed here.
#
# Deliberately NOT what "Update parliament TODO" does: nothing is generated,
# nothing is committed, and nothing is published. Run this before trusting
# that workflow's output.

on:
  workflow_dispatch:
    inputs:
      # The identity spot-check is the one thing here worth pointing at another
      # person: it is how a member whose dates look wrong gets their
      # MemberCouncilHistory read (section 3 says so when it disagrees).
      last_name:
        description: "Surname to look up on parlament.ch"
        required: false
        default: "Parmelin"
      expect_person_number:
        description: "The P1307 value Wikidata holds for that person"
        required: false
        default: "1108"

# Read-only on purpose. This workflow must never write to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      # Every step runs even when an earlier one fails: one dispatch should
      # answer every question, not stop at the first bad news.
      - name: Probe the parlament.ch source and the P1307 join
        id: source
        continue-on-error: true
        env:
          # Via env rather than inline ${{ }}, so a surname can never be
          # interpolated into the shell.
          LAST_NAME: ${{ inputs.last_name }}
          EXPECT: ${{ inputs.expect_person_number }}
        run: |
          set +e
          uv run python scripts/verify_source.py \
            --config config/parliament.yaml \
            --last-name "$LAST_NAME" \
            --expect "$EXPECT" 2>&1 | tee source.txt
          status=${PIPESTATUS[0]}
          {
            echo "## 1. parlament.ch source and the P1307 join"
            echo
            echo '```'
            cat source.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Verify the configured Q-IDs
        id: qids
        continue-on-error: true
        run: |
          set +e
          uv run python -m wd_parliament \
            --config config/parliament.yaml --verify-config 2>&1 | tee qids.txt
          status=${PIPESTATUS[0]}
          {
            echo "## 2. Configured Q-IDs"
            echo
            echo '```'
            cat qids.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # README step 0c: does MemberCouncil.DateJoining agree with OpenParlData's
      # per-term begin_date? Both kinds that emit P580 are mechanical, so a
      # disagreement blocks a bulk apply — but not the generation of reports,
      # which is what this job's pass/fail is about. Reports, does not gate.
      - name: Compare the tenure start dates (step 0c)
        id: tenure
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/compare_tenure_dates.py \
            --config config/parliament.yaml 2>&1 | tee tenure.txt
          {
            echo "## 3. Tenure start dates — README step 0c"
            echo
            echo '```'
            cat tenure.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 4: does the interval overlap agree with who actually voted?
      # Reports, does not gate — for a different reason than the one above.
      # P2937 is the qualifier this decides, `terms:` in the config ships empty,
      # and the tool skips unknown values, so nothing this check could falsify
      # currently reaches QuickStatements at all. It gates a *bulk apply* the
      # day that map is filled in, not the generation of reports.
      #
      # The votes are discovered from the `Vote` table, one per period, for the
      # three most recent periods — which is what removed this step's `vote_ids`
      # input, since nobody has to supply IdVote numbers any more. Name them by
      # hand with `--validate-periods 12345 23456` locally if you want exactly
      # those.
      - name: Cross-check the period join (step 4)
        id: periods
        continue-on-error: true
        run: |
          set +e
          uv run python -m wd_parliament \
            --config config/parliament.yaml \
            --validate-periods 2>&1 | tee periods.txt
          {
            echo "## 4. Legislative-period join — README step 4"
            echo
            echo '```'
            cat periods.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 8: may the departed members' P582 be applied in bulk?
      # Reports, does not gate — the third variety of "does not gate" in this
      # file. The suggestions it measures are report-only *by construction*
      # (two gates in diff._departed_suggestion), so nothing it could falsify
      # reaches QuickStatements today; what its CONFIRMED licenses is removing
      # those gates, which is a deliberate act, not a run.
      #
      # INCONCLUSIVE is the expected answer on tidy data: the population is
      # whatever Wikidata has left open for people who have gone, and a small
      # one is good news about the data rather than a failed probe. That is why
      # this step must never gate the job.
      - name: Check the departed members' leaving dates (step 8)
        id: departures
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/verify_departures.py \
            --config config/parliament.yaml 2>&1 | tee departures.txt
          {
            echo "## 5. Departed members' leaving dates — README step 8"
            echo
            echo '```'
            cat departures.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 7: the cantonal config. Reports, does not gate — for the
      # plainest reason of the non-gating checks: it measures the Kantonsrat
      # Zürich, so nothing it finds can make the *federal* pipeline more or less
      # safe to run. Its section C is what would license flipping
      # `identifier_verified` in config/kantonsrat-zh.yaml, and it is measured
      # at 34 of 35.
      #
      # The body and the position Q-ID were dispatch inputs while the position
      # was unverified and section D was checking candidates. Both are settled
      # (body ZH, Q21518678 held by 167 of the 180 sitting members), so the
      # script's own defaults are used; another canton needs --expect-seats and
      # --seat-roles too, which is a local run rather than a dispatch.
      - name: Evaluate the cantonal config — Kantonsrat Zürich (step 7)
        id: kantonsrat
        continue-on-error: true
        run: |
          set +e
          uv run python scripts/verify_kantonsrat.py \
            --config config/parliament.yaml 2>&1 | tee kantonsrat.txt
          {
            echo "## 6. Cantonal extension — README step 7 (evaluation only)"
            echo
            echo '```'
            cat kantonsrat.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # README step 9: do the personal-data checks have a source, and how much
      # work would each one create? Reports, does not gate — for the same
      # reason as step 8 but more strongly: ADD_PERSON_DATA is not in
      # MECHANICAL_KINDS at all, so nothing it measures can ever reach
      # suggestions.qs. A CONTRADICTED here means a property listed in
      # `person_data:` has no source column and is quietly making no
      # suggestions, which is a tidiness finding, not a fault.
      #
      # Runs for both configs: the two sources answer different halves of the
      # list, and this is the probe that reads each one's real column names —
      # which is how two long-standing bugs in the cantonal adapter were found.
      - name: Measure the personal-data checks (step 9)
        id: persondata
        continue-on-error: true
        run: |
          set +e
          for cfg in config/parliament.yaml config/kantonsrat-zh.yaml; do
            echo "### $cfg"
            uv run python scripts/verify_person_data.py --config "$cfg" 2>&1
          done | tee persondata.txt
          {
            echo "## 7. Personal-data checks — README step 9"
            echo
            echo '```'
            cat persondata.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summarise and set the job result
        run: |
          source_step="${{ steps.source.outcome }}"
          qids="${{ steps.qids.outcome }}"
          {
            echo "## Result"
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| parlament.ch source + P1307 join | \`$source_step\` |"
            echo "| Configured Q-IDs | \`$qids\` |"
            echo "| Tenure start dates (0c) | \`${{ steps.tenure.outcome }}\` (does not gate) |"
            echo "| Period join (step 4) | \`${{ steps.periods.outcome }}\` (does not gate) |"
            echo "| Departed members' dates (step 8) | \`${{ steps.departures.outcome }}\` (does not gate) |"
            echo "| Cantonal extension (step 7) | \`${{ steps.kantonsrat.outcome }}\` (does not gate) |"
            echo "| Personal-data checks (step 9) | \`${{ steps.persondata.outcome }}\` (does not gate) |"
            echo
            if [ "$source_step" = "success" ] && [ "$qids" = "success" ]; then
              echo "Both gating checks passed: the members are readable, the"
              echo "identifier join is verified, and every configured Q-ID resolves"
              echo "— read the labels above to confirm they name what you meant."
              echo "Before *applying* anything, read section 3's second verdict"
              echo "(P580 as emitted), section 4, and — if you are thinking of"
              echo "ungating the departed members — section 5. The only question"
              echo "left that nothing here can answer is README step 5: paste one"
              echo "line into QuickStatements by hand and check it lands."
            else
              echo "At least one check failed — see the detail above. Do not run"
              echo "\"Update parliament TODO\" or apply any QuickStatements until"
              echo "both are green."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$source_step" = "success" ] && [ "$qids" = "success" ]
